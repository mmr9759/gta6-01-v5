<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="VELMARA: Streets of Gold — a 2D top-down open-world crime game. Ten story missions, taxi fares, street races, a 0–5 star wanted level, police chases, roadblocks and a helicopter, all in one sun-soaked city.">
<title>VELMARA: Streets of Gold — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e1420; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #7fae5a; image-rendering: auto; }
  #hint { color: #9fb8c4; font-size: 13px; text-align: center; padding: 8px 12px; line-height: 1.5; }
  #hint b { color: #ffd94a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint"><b>VELMARA: Streets of Gold</b> — WASD drive &amp; walk · E enter / steal car · F punch · Click shoot · SHIFT nitro · M missions · P pause · Sound starts on first click</div>
</div>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/render.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
